version: '3.8'

services:
  wg-panel:
    build: .
    container_name: wg-panel
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "8080:8080"
      - "51820:51820/udp"
    volumes:
      - wg-data:/etc/wireguard
    environment:
      - WG_HOST=localhost
      - WG_PORT=51820
      - FLASK_SECRET_KEY=local_development_secret
    restart: unless-stopped

volumes:
  wg-data: