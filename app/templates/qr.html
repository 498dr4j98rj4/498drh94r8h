<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - {{ peer.name }}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .qr-card {
            max-width: 400px;
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .qr-image {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin: 0 auto;
            display: block;
            border-radius: 8px;
            image-rendering: pixelated;
        }
        .qr-container {
            background: #ffffff; /* White background is required for QR readability */
            padding: 20px;
            border-radius: var(--radius-md);
            text-align: center;
            margin: 24px 0;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="card qr-card p-4 p-sm-5">
        <div class="text-center mb-2">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-3">
                <i class="bi bi-qr-code-scan fs-3"></i>
            </div>
            <h4 class="mb-1 fw-bold">{{ peer.name }}</h4>
            <div class="badge bg-secondary px-3 py-2 mt-2 fs-6">{{ peer.ip }}</div>
        </div>

        <div class="qr-container">
            <img src="{{ qr_b64 }}" class="qr-image" alt="WireGuard QR Code">
        </div>

        <div class="alert alert-dark bg-opacity-10 border-0 small py-3 mb-4 text-muted d-flex align-items-center">
            <i class="bi bi-info-circle me-3 fs-5 text-primary"></i>
            <span>Scan this with the WireGuard app on your mobile device to configure automatically.</span>
        </div>

        <div class="d-grid gap-3">
            <a href="/peer/{{ peer.id }}/config" class="btn btn-primary btn-lg fw-medium">
                <i class="bi bi-download me-2"></i> Download Config File
            </a>
            <button onclick="window.close()" class="btn btn-outline-secondary fw-medium">Close Window</button>
        </div>
    </div>
</body>
</html>
